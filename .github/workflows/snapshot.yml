# Saves real option quotes (bid/ask/volume/open interest) from Yahoo every weekday
# afternoon into data/yahoo/, so we build our own daily history going forward.
name: Daily Yahoo quotes

on:
  schedule:
    - cron: "37 19 * * 1-5"   # 19:37 UTC = 3:37pm New York in summer, 2:37pm in winter
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas yfinance

      - run: python snapshot_yahoo.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Yahoo quotes: $(date +%F)"
          git pull --rebase origin main
          git push
