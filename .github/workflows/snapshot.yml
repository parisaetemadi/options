# Saves real option quotes (bid/ask/volume/open interest) from Yahoo every weekday
# afternoon into data/yahoo/ (latest run before the close wins), so we build our own daily history going forward.
name: Daily Yahoo quotes

on:
  schedule:
    # Several tries, because GitHub often starts scheduled runs late (sometimes by hours).
    # UTC times: 17:07-20:07 = 1:07-4:07pm New York in summer, 12:07-3:07pm in winter.
    - cron: "7 17,18,19,20 * * 1-5"
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas yfinance

      - run: python snapshot_yahoo.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Yahoo quotes: $(date +%F)"
          git pull --rebase origin main
          git push
