# Free intraday option quotes (SPY, QQQ, TSLA, IWM, NVDA near the money) from Yahoo, then the options
# paper trader (paper_options.py), which writes data/paper_options/dashboard.json for the website.
# Started every 15 minutes in market hours by cron-job.org through the API (workflow_dispatch):
# GitHub's own schedule below fired only ~2 times a day, so it stays only as a backup.
name: Intraday Yahoo quotes

on:
  schedule:
    # UTC; the script itself checks New York market hours (9:35am-4:05pm), so summer/winter both work
    - cron: "13,43 13-21 * * 1-5"
  workflow_dispatch:

concurrency:
  group: intraday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pandas yfinance pandas_market_calendars

      - run: python snapshot_intraday.py

      - name: Paper trade options
        run: python paper_options.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo_intraday data/paper_options 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Intraday quotes: $(date -u +%F' '%H:%M)"
          git pull --rebase origin main
          git push
