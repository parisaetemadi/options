# Paper trading (FAKE money): after each close, decide from today's Yahoo snapshot and score the
# fake account against real closing prices. Decisions are appended once and committed (see paper_trade.py).
name: Paper trading

on:
  schedule:
    # after the close; two tries because GitHub often starts scheduled runs late
    # UTC 21:45 = 5:45pm New York in summer (4:45pm in winter); 00:15 = the evening
    - cron: "45 21 * * 1-5"
    - cron: "15 0 * * 2-6"
  workflow_dispatch:

concurrency:
  group: paper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy pandas scipy yfinance lightgbm scikit-learn joblib pyarrow

      - run: python paper_trade.py

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals data/paper data/market 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Paper trading: $(date +%F)"
          git pull --rebase origin main
          git push
